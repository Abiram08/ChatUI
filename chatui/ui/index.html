<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>{{TITLE}}</title>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<link rel="stylesheet" href="vendor/github-dark.min.css">
<script src="vendor/highlight.min.js"></script>
<style>/*{{STYLES}}*/</style>
</head>
<body class="layout-{{LAYOUT}}">
<div class="conn-banner" id="connBanner">
  <span class="conn-banner-text">Connection lost — reconnecting…</span>
  <button class="conn-retry" id="connRetry" type="button">Retry now</button>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">{{LOGO}}</div>
        <span class="logo-text">{{TITLE}}</span>
      </div>
      <button class="btn-new" id="newBtn">+ New chat</button>
    </div>
    <div class="conversations" id="convList">
      <div class="conv-empty">No chats yet</div>
    </div>
    <div class="sidebar-footer">
      <button class="btn-settings" id="settingsBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="tab-bar" id="tabBar">
      <button class="tab-menu" id="tabMenuBtn" aria-label="Menu">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="tab-list" id="tabList"></div>
      <button class="tab-new" id="tabNewBtn" aria-label="New chat">+</button>
    </div>

    <header class="chat-header" id="chatHeader">
      <div class="chat-header-left">
        <span class="chat-header-title">{{TITLE}}</span>
      </div>
      <div class="chat-header-status">
        <span class="status-dot online" id="statusDot" aria-hidden="true"></span>
        <span class="status-text" id="statusBadge">Ready</span>
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">{{LOGO}}</div>
        <h1 class="welcome-title">{{WELCOME_TITLE}}</h1>
        <p class="welcome-sub" id="welcomeSub">{{SUBTITLE}}</p>
        <div class="chips" id="chipsRow"></div>
      </div>
      <div class="message-list" id="messageList"></div>
    </div>

    <button class="scroll-bottom" id="scrollBtn" type="button" aria-label="Scroll to latest" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    </button>

    <div class="composer">
      <div class="composer-inner">
        <div class="composer-box">
          <textarea class="composer-input" id="input" placeholder="Ask anything…" rows="1" maxlength="12000" aria-label="Message input"></textarea>
          <div class="composer-actions">
            <button class="btn-stop" id="stopBtn" aria-label="Stop generating" title="Stop (Esc)">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
            </button>
            <button class="btn-send" id="sendBtn" aria-label="Send message" title="Send (Enter)" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-hint">
          <span><kbd>Enter</kbd> send &middot; <kbd>Shift</kbd>+<kbd>Enter</kbd> newline &middot; <kbd>Ctrl</kbd>+<kbd>K</kbd> history</span>
        </div>
      </div>
    </div>
  </main>
</div>

<button class="menu-btn" id="menuBtn" aria-label="Menu">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>

<div class="settings-overlay" id="settingsOverlay" hidden></div>
<div class="settings-panel" id="settingsPanel" hidden>
  <button class="settings-close" id="settingsClose">&times;</button>
  <div class="settings-title">Settings</div>
  <div class="settings-group">
    <label class="settings-label">Theme</label>
    <select class="settings-select" id="themeSelect"></select>
  </div>
  <div class="settings-group">
    <div class="settings-label">Typeface</div>
    <div class="font-opts">
      <button class="font-opt active" data-font="sans">Sans</button>
      <button class="font-opt" data-font="serif">Serif</button>
      <button class="font-opt" data-font="mono">Mono</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const THEME_DATA   = {{THEMES_JSON}};
const ACTIVE_THEME = '{{ACTIVE_THEME}}';
const CHIPS_DATA   = {{CHIPS_JSON}};
const LAYOUT       = '{{LAYOUT}}';
const SUBTITLE_TEXT = '{{SUBTITLE}}';
const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
</script>
<script src="js/app.js"></script>
</body>
</html>
