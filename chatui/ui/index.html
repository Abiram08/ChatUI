<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
/*{{THEME_VARS}}*/

/* ── Reset ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-sans);
  background: var(--bg-base);
  color: var(--text-primary);
  font-size: var(--font-size-base, 15px);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── App shell ──────────────────────────────────────────── */
.app { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ────────────────────────────────────────────── */
.sidebar {
  width: 264px; flex-shrink: 0;
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  display: flex; flex-direction: column; overflow: hidden;
}

/* Header */
.sb-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.125rem 1rem;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.logo { display: flex; align-items: center; gap: 9px; }
.logo-icon {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
  box-shadow: 0 0 16px var(--accent-glow), 0 2px 8px rgba(0,0,0,.3);
}
.logo-text { font-size: 14px; font-weight: 600; letter-spacing: -.025em; }
.sb-btns { display: flex; gap: 4px; }
.ib {
  width: 28px; height: 28px; border-radius: 7px;
  border: 1px solid var(--border-subtle);
  background: transparent; color: var(--text-secondary);
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 13px;
  transition: background .12s, border-color .12s, color .12s;
}
.ib:hover { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border-medium); }

/* Settings panel */
.sys-panel {
  overflow: hidden; max-height: 0;
  transition: max-height .3s cubic-bezier(.4,0,.2,1);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.sys-panel.open { max-height: 480px; }
.sys-inner {
  padding: .75rem 1rem .875rem;
  overflow-y: auto; max-height: 480px;
  display: flex; flex-direction: column; gap: .875rem;
}
.setting-block { display: flex; flex-direction: column; gap: .375rem; }
/* Font toggle */
.font-opts { display: flex; gap: 6px; }
.font-opt {
  flex: 1; padding: 5px 0; border-radius: 6px;
  border: 1px solid var(--border-subtle);
  background: transparent; color: var(--text-secondary);
  font-size: 11px; font-family: var(--font-sans);
  cursor: pointer; transition: all .12s; text-align: center;
}
.font-opt:hover { color: var(--text-primary); border-color: var(--border-medium); background: var(--bg-elevated); }
.font-opt.active { color: var(--text-accent); border-color: var(--border-focus); background: var(--accent-glow); }
/* Size toggle */
.size-opts { display: flex; gap: 6px; }
.size-opt {
  width: 38px; height: 30px; border-radius: 6px;
  border: 1px solid var(--border-subtle);
  background: transparent; color: var(--text-secondary);
  cursor: pointer; transition: all .12s;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-sans); line-height: 1;
}
.size-opt:hover { color: var(--text-primary); border-color: var(--border-medium); background: var(--bg-elevated); }
.size-opt.active { color: var(--text-accent); border-color: var(--border-focus); background: var(--accent-glow); }
.sb-section-label {
  font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: .5rem;
}
.sys-ta {
  width: 100%; background: var(--bg-elevated);
  border: 1px solid var(--border-subtle); border-radius: 8px;
  color: var(--text-primary); font-family: var(--font-sans);
  font-size: 12.5px; padding: .625rem .875rem;
  resize: none; outline: none; line-height: 1.55; height: 90px;
  transition: border-color .15s;
}
.sys-ta:focus { border-color: var(--border-focus); }
.sys-save {
  margin-top: 7px; padding: 4px 14px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 6px;
  font-size: 12px; font-family: var(--font-sans); font-weight: 500;
  cursor: pointer; transition: background .15s, transform .1s;
}
.sys-save:hover { background: var(--accent-hover); }
.sys-save:active { transform: scale(.97); }

/* ── Theme dropdown ──────────────────────────────────────── */
.theme-select {
  width: 100%; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--border-subtle);
  background: var(--bg-elevated); color: var(--text-primary);
  font-family: var(--font-sans); font-size: 12px;
  cursor: pointer; outline: none; appearance: none;
  transition: border-color .15s;
}
.theme-select:focus { border-color: var(--border-focus); }
.theme-select option { background: var(--bg-elevated); color: var(--text-primary); }

/* ── Tools panel (shown when @app.tool is registered) ───── */
.sb-tools {
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0; padding-bottom: .5rem;
}
.sb-tools-head {
  display: flex; align-items: center; gap: 6px;
  padding: .625rem 1rem .25rem;
}
.sb-tools-head .sb-section-label { margin-bottom: 0; }
.tools-count {
  font-family: var(--font-mono); font-size: 9px;
  background: var(--accent-glow); color: var(--text-accent);
  border: 1px solid var(--tool-border); border-radius: 999px;
  padding: 1px 6px; font-weight: 600;
}
.tool-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: .3rem 1rem; transition: background .1s; cursor: default;
}
.tool-item:hover { background: var(--bg-elevated); }
.tool-item-icon { color: var(--tool-text); font-size: 11px; margin-top: 2px; flex-shrink: 0; }
.tool-item-name {
  font-family: var(--font-mono); font-size: 11.5px;
  color: var(--tool-text); font-weight: 500;
}
.tool-item-desc {
  font-size: 10.5px; color: var(--text-tertiary); margin-top: 1px; line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* Conversations list */
.sb-convs { flex: 1; overflow-y: auto; padding: .625rem .5rem; }
.sb-convs::-webkit-scrollbar { width: 3px; }
.sb-convs::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }
.cv {
  padding: .45rem .75rem; border-radius: 7px; cursor: pointer;
  color: var(--text-secondary); font-size: 12.5px;
  border-left: 2px solid transparent; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: all .1s;
}
.cv:hover { background: var(--bg-elevated); color: var(--text-primary); }
.cv.active { background: var(--accent-glow); color: var(--text-primary); border-left-color: var(--accent); }

/* Sidebar footer */
.sb-foot {
  padding: .75rem 1rem; flex-shrink: 0;
  border-top: 1px solid var(--border-subtle);
  display: flex; align-items: center; justify-content: space-between;
}
.cs { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-tertiary); }
.sd {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--success); flex-shrink: 0;
  box-shadow: 0 0 6px var(--success);
  transition: background .3s, box-shadow .3s;
}
.sd.off { background: var(--error); box-shadow: 0 0 6px var(--error); }

/* ── Main panel ─────────────────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }


.mwrap { flex: 1; overflow-y: auto; padding: 2rem 1rem; scroll-behavior: smooth; }
.mwrap::-webkit-scrollbar { width: 4px; }
.mwrap::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 2px; }
.mlist { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }

/* ── Welcome screen ─────────────────────────────────────── */
.welcome {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 62vh; text-align: center; padding: 2rem;
}
.wi {
  width: 62px; height: 62px; border-radius: 18px;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 700; margin-bottom: 1.375rem;
  box-shadow: 0 0 40px var(--accent-glow), 0 8px 28px rgba(0,0,0,.3);
  animation: floatIcon 4s ease-in-out infinite;
}
@keyframes floatIcon {
  0%, 100% { transform: translateY(0); box-shadow: 0 0 40px var(--accent-glow), 0 8px 28px rgba(0,0,0,.3); }
  50% { transform: translateY(-5px); box-shadow: 0 0 60px var(--accent-glow), 0 16px 36px rgba(0,0,0,.2); }
}
.wt { font-size: 30px; font-weight: 600; letter-spacing: -.04em; margin-bottom: .4rem; }
.ws { font-size: 14.5px; color: var(--text-secondary); margin-bottom: 2rem; max-width: 380px; line-height: 1.55; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 520px; }
.chip {
  padding: .45rem 1.1rem;
  background: var(--bg-surface); border: 1px solid var(--border-medium);
  border-radius: 999px; color: var(--text-secondary);
  font-size: 13px; font-family: var(--font-sans);
  cursor: pointer; transition: all .15s;
}
.chip:hover {
  background: var(--bg-elevated); color: var(--text-primary);
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
}

/* ── Messages ───────────────────────────────────────────── */
.msg {
  display: flex; gap: 10px; align-items: flex-start;
  animation: mIn .22s ease forwards; opacity: 0; transform: translateY(8px);
}
@keyframes mIn { to { opacity: 1; transform: translateY(0); } }
.msg.user { flex-direction: row-reverse; }

.av {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; margin-top: 2px;
}
.av.ai { background: var(--accent); color: #fff; box-shadow: 0 0 12px var(--accent-glow); }
.av.user { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border-medium); }

.mb { max-width: 580px; }
.bub { padding: .875rem 1.125rem; border-radius: 16px; line-height: 1.75; }
.msg.ai .bub {
  /* gradient baked into the background — no pseudo-element that stacks over content */
  background: radial-gradient(ellipse at top left, var(--accent-glow) 0%, var(--bg-surface) 55%);
  border: 1px solid var(--border-subtle);
  border-top-left-radius: 4px; color: var(--text-primary);
}
.msg.user .bub {
  background: var(--bg-user-msg); border: 1px solid rgba(99,102,241,.2);
  border-top-right-radius: 4px; color: var(--text-primary);
  text-align: left;
}

/* Message meta */
.mmeta {
  display: flex; align-items: center; gap: 8px;
  margin-top: 5px; padding: 0 4px;
}
.mt { font-size: 11px; color: var(--text-tertiary); opacity: 0; transition: opacity .15s; }
.msg:hover .mt { opacity: 1; }
.msg.user .mmeta { flex-direction: row-reverse; }
.tbadge {
  font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary);
  background: var(--bg-elevated); border: 1px solid var(--border-subtle);
  border-radius: 4px; padding: 1px 7px;
  opacity: 0; transition: opacity .15s;
}
.msg:hover .tbadge { opacity: 1; }

/* ── Message action buttons (copy / retry) ──────────────── */
.msg-actions {
  display: flex; gap: 4px; align-items: center;
  margin-top: 4px; padding: 0 4px;
  opacity: 0; pointer-events: none; transition: opacity .15s;
}
.msg.ai:hover .msg-actions { opacity: 1; pointer-events: auto; }
.ma-btn {
  background: transparent; border: 1px solid var(--border-subtle);
  border-radius: 5px; color: var(--text-tertiary);
  font-size: 11px; padding: 2px 8px; cursor: pointer;
  font-family: var(--font-sans); transition: all .15s;
}
.ma-btn:hover { color: var(--text-primary); border-color: var(--border-medium); background: var(--bg-elevated); }
.ma-btn.regen { color: var(--text-accent); border-color: var(--tool-border); }
.ma-btn.regen:hover { background: var(--tool-bg); border-color: var(--text-accent); }

/* ── Markdown prose ─────────────────────────────────────── */
.prose p { margin-bottom: .75rem; }
.prose p:last-child { margin-bottom: 0; }
.prose strong { font-weight: 600; color: var(--text-primary); }
.prose em { color: var(--text-secondary); font-style: italic; }
.prose ul, .prose ol { margin: .5rem 0 .75rem 1.375rem; }
.prose li { margin-bottom: .3rem; }
.prose code {
  font-family: var(--font-mono); font-size: 12.5px;
  background: rgba(255,255,255,.06); border: 1px solid var(--border-subtle);
  border-radius: 5px; padding: 1px 6px; color: var(--text-accent);
}
.prose pre {
  margin: .875rem 0; border-radius: 11px;
  overflow: hidden; border: 1px solid var(--border-subtle);
  box-shadow: 0 2px 14px rgba(0,0,0,.2);
}
.prose pre code {
  display: block; padding: 1rem 1.125rem;
  background: #0d0d0d; border: none; border-radius: 0;
  font-size: 13px; line-height: 1.65; overflow-x: auto; color: var(--text-primary);
}
.prose a { color: var(--text-accent); text-decoration: none; border-bottom: 1px solid rgba(129,140,248,.3); }
.prose a:hover { border-bottom-color: var(--text-accent); }
.prose h1 { font-size: 19px; font-weight: 600; margin: 1.25rem 0 .5rem; letter-spacing: -.025em; }
.prose h2 { font-size: 16.5px; font-weight: 600; margin: 1rem 0 .5rem; letter-spacing: -.015em; }
.prose h3 { font-size: 15px; font-weight: 600; margin: .875rem 0 .4rem; }
.prose blockquote { border-left: 3px solid var(--accent); padding-left: .875rem; color: var(--text-secondary); margin: .875rem 0; }
.prose table { border-collapse: collapse; width: 100%; margin: .875rem 0; font-size: 13px; }
.prose th, .prose td { border: 1px solid var(--border-medium); padding: 7px 12px; text-align: left; }
.prose th { background: var(--bg-elevated); font-weight: 600; color: var(--text-primary); }
.prose td { color: var(--text-secondary); }
.prose hr { border: none; border-top: 1px solid var(--border-subtle); margin: 1rem 0; }

/* Code block header */
.chdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 14px; background: #0d0d0d;
  border-bottom: 1px solid rgba(255,255,255,.06);
  font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary);
}
.cbtn {
  background: transparent; border: 1px solid rgba(255,255,255,.1);
  border-radius: 5px; color: var(--text-tertiary);
  font-size: 10.5px; padding: 2px 9px; cursor: pointer;
  transition: all .15s; font-family: var(--font-sans);
}
.cbtn:hover { color: var(--text-primary); border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.05); }

/* ── Streaming cursor ───────────────────────────────────── */
.scur {
  display: inline-block; width: 2px; height: 1em;
  background: var(--text-accent); margin-left: 1px;
  vertical-align: text-bottom; animation: bl .7s step-end infinite;
}
@keyframes bl { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* ── Thinking dots ──────────────────────────────────────── */
.think { display: flex; gap: 6px; align-items: center; padding: 6px 2px; }
.td {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-accent);
  animation: pu 1.4s ease-in-out infinite;
}
.td:nth-child(2) { animation-delay: .2s; }
.td:nth-child(3) { animation-delay: .4s; }
@keyframes pu { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }

/* ── Tool call card ─────────────────────────────────────── */
.tc {
  border: 1px solid var(--tool-border);
  background: var(--tool-bg);
  border-radius: 12px; overflow: hidden;
  margin: .25rem 0;
  animation: mIn .22s ease forwards; opacity: 0;
  font-family: var(--font-mono); position: relative;
}
/* Gradient accent bar along the top */
.tc::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--tool-text) 0%, transparent 80%);
}
.tch {
  display: flex; align-items: center; gap: 8px;
  padding: .625rem 1rem; border-bottom: 1px solid var(--tool-border);
}
/* ⚡ icon animates while running */
.tch > span:first-child { font-size: 14px; flex-shrink: 0; }
.tch:has(.tbg.run) > span:first-child { animation: sparkle 1.2s ease-in-out infinite; }
@keyframes sparkle { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

.tfn { font-size: 13px; font-weight: 600; color: var(--tool-text); flex: 1; }
.tbg {
  font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; font-weight: 600;
  background: rgba(52,211,153,.12); color: var(--tool-text);
  transition: all .25s;
}
.tbg.run { background: rgba(251,191,36,.15); color: #fbbf24; animation: pulseBadge 1.6s ease-in-out infinite; }
@keyframes pulseBadge { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

.tcb { padding: .75rem 1rem; }
.tar { display: flex; gap: 6px; font-size: 12.5px; margin-bottom: 4px; align-items: baseline; }
.tak { color: var(--tool-arg); min-width: 68px; font-weight: 500; }
.tav { color: var(--text-secondary); }
.tdiv { border: none; border-top: 1px solid var(--tool-border); margin: .625rem 0; }
.trr { font-size: 12.5px; color: var(--tool-result); display: flex; gap: 8px; align-items: flex-start; }
.tra { color: var(--tool-arg); flex-shrink: 0; font-weight: 600; }
.trv { word-break: break-all; }

/* ── Component cards (@app.component) ──────────────────── */
.comp-card {
  border: 1px solid var(--border-medium);
  background: var(--bg-surface);
  border-radius: 14px; overflow: hidden;
  margin: .25rem 0;
  animation: mIn .22s ease forwards; opacity: 0;
  position: relative;
}
.comp-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--text-accent) 0%, transparent 80%);
}
.comp-head {
  display: flex; align-items: center; gap: 8px;
  padding: .625rem 1rem; border-bottom: 1px solid var(--border-subtle);
  font-family: var(--font-mono); font-size: 12px;
}
.comp-icon { color: var(--text-accent); font-size: 13px; }
.comp-name { color: var(--text-accent); font-weight: 600; flex: 1; }
.comp-badge {
  font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 999px; font-weight: 600;
  background: rgba(129,140,248,.12); color: var(--text-accent);
}
.comp-body {
  padding: 1rem;
  /* Component HTML renders here — scripts execute */
}
.comp-body img { max-width: 100%; border-radius: 8px; }
.comp-body canvas { max-width: 100%; }
.comp-body table { width: 100%; border-collapse: collapse; font-size: 13px; }
.comp-body th, .comp-body td { border: 1px solid var(--border-subtle); padding: 6px 10px; text-align: left; }
.comp-body th { background: var(--bg-elevated); font-weight: 600; }

/* ── Input area ─────────────────────────────────────────── */
.ia {
  padding: 1rem 1.5rem 1.375rem;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-base);
  max-width: calc(700px + 3rem); width: 100%; margin: 0 auto;
  flex-shrink: 0;
}
.iw {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle); border-radius: 16px;
  padding: .75rem .75rem .75rem 1.125rem;
  transition: border-color .15s, box-shadow .15s;
}
.iw:focus-within { border-color: var(--border-focus); box-shadow: 0 0 0 3px var(--accent-glow); }
.ci {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text-primary); font-family: var(--font-sans);
  line-height: 1.6;
  resize: none; max-height: 140px; overflow-y: auto; padding: 0;
}
.ci::placeholder { color: var(--text-tertiary); }
.ci::-webkit-scrollbar { width: 3px; }
.ci::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }
.sb2 {
  width: 34px; height: 34px; border-radius: 10px; border: none;
  background: var(--accent); color: #fff;
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
  box-shadow: 0 2px 10px var(--accent-glow);
  transition: background .15s, transform .12s, box-shadow .15s;
}
.sb2:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-glow); }
.sb2:active:not(:disabled) { transform: translateY(0); }
.sb2:disabled { background: var(--bg-surface); color: var(--text-tertiary); cursor: not-allowed; box-shadow: none; }
.stb {
  width: 34px; height: 34px; border-radius: 10px;
  border: 1px solid var(--border-medium);
  background: transparent; color: var(--error);
  cursor: pointer; flex-shrink: 0;
  display: none; align-items: center; justify-content: center;
  font-size: 13px; transition: all .15s;
}
.stb.vis { display: flex; }
.stb:hover { background: rgba(248,113,113,.1); border-color: var(--error); }
.ih { font-size: 11px; color: var(--text-tertiary); text-align: center; margin-top: .5rem; }

/* ── Scrollbar ──────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sb-head">
      <div class="logo">
        <div class="logo-icon">{{LOGO}}</div>
        <span class="logo-text">{{TITLE}}</span>
      </div>
      <div class="sb-btns">
        <button class="ib" id="sysBtn" title="Edit system prompt">⚙</button>
        <button class="ib" id="newBtn" title="New conversation">+</button>
      </div>
    </div>

    <!-- Settings panel — theme, font, size, system prompt -->
    <div class="sys-panel" id="sysPanel">
      <div class="sys-inner">

        <div class="setting-block">
          <div class="sb-section-label">Themes</div>
          <select class="theme-select" id="themeSelect"></select>
        </div>

        <div class="setting-block">
          <div class="sb-section-label">Font</div>
          <div class="font-opts">
            <button class="font-opt active" data-font="sans">Sans &nbsp;·&nbsp; Inter</button>
            <button class="font-opt" data-font="mono">Mono &nbsp;·&nbsp; JetBrains</button>
          </div>
        </div>

        <div class="setting-block">
          <div class="sb-section-label">Text Size</div>
          <div class="size-opts">
            <button class="size-opt" data-size="sm" style="font-size:11px">A</button>
            <button class="size-opt active" data-size="md" style="font-size:14px">A</button>
            <button class="size-opt" data-size="lg" style="font-size:17px">A</button>
          </div>
        </div>

        <div class="setting-block">
          <div class="sb-section-label">System Prompt</div>
          <textarea class="sys-ta" id="sysTa" placeholder="You are a helpful assistant..."></textarea>
          <button class="sys-save" id="sysSave">Save &amp; restart</button>
        </div>

      </div>
    </div>

    <!-- Registered tools panel — shown when @app.tool is used -->
    <div class="sb-tools" id="sbTools" style="display:none">
      <div class="sb-tools-head">
        <div class="sb-section-label">Registered Tools</div>
        <span class="tools-count" id="toolsCount"></span>
      </div>
      <div id="toolsList"></div>
    </div>

    <!-- Conversation history -->
    <div class="sb-convs" id="convList">
      <div style="padding:1.25rem .75rem;font-size:12px;color:var(--text-tertiary);text-align:center">
        No conversations yet
      </div>
    </div>

    <div class="sb-foot">
      <div class="cs">
        <span class="sd" id="sd"></span>
        <span id="st">Connecting…</span>
      </div>
      <button class="ib" id="expBtn" title="Export conversation">↓</button>
    </div>
  </aside>

  <!-- ── Main chat area ──────────────────────────────────── -->
  <main class="main">
    <div class="mwrap" id="mwrap">
      <div class="welcome" id="welcome">
        <div class="wi">{{LOGO}}</div>
        <h1 class="wt">{{TITLE}}</h1>
        <p class="ws" id="welcomeSub"></p>
        <div class="chips" id="chipsRow"></div>
      </div>
      <div class="mlist" id="mlist"></div>
    </div>

    <div class="ia">
      <div class="iw">
        <textarea id="ci" class="ci" placeholder="Message {{TITLE}}…" rows="1" maxlength="10000"></textarea>
        <button class="stb" id="stb" title="Stop generation">■</button>
        <button class="sb2" id="sb2" title="Send message">↑</button>
      </div>
      <div class="ih">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
    </div>
  </main>
</div>

<script>
marked.setOptions({breaks:true, gfm:true});
const WS_URL = `ws://${location.host}/ws`;

/* ── Theme data (injected by server) ───────────────────── */
const THEME_DATA   = '{{THEMES_JSON}}';
const ACTIVE_THEME = '{{ACTIVE_THEME}}';

const THEME_LABELS = {
  darkside:   'Dark Side',
  tokyonight: 'Tokyo Night',
  rosepine:   'Rosé Pine',
  gruvbox:    'Gruvbox',
  catppuccin: 'Catppuccin',
  nord:       'Nord',
  ayu:        'Ayu',
};

function applyTheme(name) {
  const vars = THEME_DATA[name];
  if (!vars) return;
  const root = document.documentElement;
  Object.entries(vars).forEach(([k, v]) => root.style.setProperty(k, v));
  const sel = document.getElementById('themeSelect');
  if (sel) sel.value = name;
}

function initThemeDots() {
  const sel = document.getElementById('themeSelect');
  if (!sel) return;
  Object.keys(THEME_DATA).forEach(name => {
    const opt = document.createElement('option');
    opt.value       = name;
    opt.textContent = THEME_LABELS[name] || name;
    if (name === ACTIVE_THEME) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => applyTheme(sel.value));
}

function setFont(type) {
  const FONTS = {
    sans: "'Inter', system-ui, sans-serif",
    mono: "'JetBrains Mono', 'Fira Code', monospace",
  };
  document.documentElement.style.setProperty('--font-sans', FONTS[type] || FONTS.sans);
  document.querySelectorAll('.font-opt').forEach(b => b.classList.toggle('active', b.dataset.font === type));
  localStorage.setItem('cui_font', type);
}

function setSize(size) {
  const SIZES = { sm: '13px', md: '15px', lg: '17px' };
  /* update the CSS variable — body + all inheriting elements scale together */
  document.documentElement.style.setProperty('--font-size-base', SIZES[size] || '15px');
  document.querySelectorAll('.size-opt').forEach(b => b.classList.toggle('active', b.dataset.size === size));
  localStorage.setItem('cui_size', size);
}

function initWelcome() {
  /* Subtitle */
  const sub = document.getElementById('welcomeSub');
  if (sub) {
    const txt = '{{SUBTITLE}}';
    if (txt) { sub.textContent = txt; } else { sub.style.display = 'none'; }
  }
  /* Chips from server-injected JSON */
  const chips = '{{CHIPS_JSON}}';
  const row = document.getElementById('chipsRow');
  if (row && chips && chips.length) {
    row.innerHTML = chips.map(c =>
      `<button class="chip" onclick="chip(${JSON.stringify(c)})">${esc(c)}</button>`
    ).join('');
  } else if (row) {
    row.style.display = 'none';
  }
}

const S = {
  ws: null, connected: false, streaming: false, retries: 0,
  streamEl: null, raw: '', thinkId: null, tbEl: null,
  currentAiMsg: null,   /* DOM element of the in-flight AI message */
  convs: JSON.parse(localStorage.getItem('cui2') || '[]'),
  aid: null, msgs: [], ascroll: true,
};

/* ── WebSocket ────────────────────────────────────────── */
function connect() {
  S.ws = new WebSocket(WS_URL);
  S.ws.onopen  = () => { S.connected = true; S.retries = 0; setStatus(true); };
  S.ws.onmessage = e => handle(JSON.parse(e.data));
  S.ws.onclose = () => {
    S.connected = false; setStatus(false);
    if (S.retries < 5) { S.retries++; setTimeout(connect, 2000); }
  };
  S.ws.onerror = () => { S.connected = false; setStatus(false); };
}
function ws(o) { if (S.ws && S.ws.readyState === 1) S.ws.send(JSON.stringify(o)); }

/* ── Message handler ─────────────────────────────────── */
function handle(d) {
  switch (d.type) {

    case 'start':
    case 'start_again':
      if (d.type === 'start') S.raw = '';
      showThink(); S.streaming = true; setInput(false);
      break;

    case 'token':
      rmThink(); S.raw += d.content; renderStream(S.raw);
      if (S.ascroll) scr();
      break;

    case 'tool_call':
      rmThink(); showCard(d.id, d.name, d.inputs);
      break;

    case 'tool_result':
      updCard(d.id, d.result);
      break;

    case 'end':
      finalise(S.raw, d.usage);
      S.streaming = false; S.streamEl = null; S.raw = ''; S.tbEl = null;
      setInput(true); focusI(); saveConv();
      break;

    case 'stopped':
      rmThink(); finalise(S.raw, null);
      S.streaming = false; S.streamEl = null; S.raw = ''; S.tbEl = null;
      S.currentAiMsg = null;
      setInput(true); focusI();
      break;

    case 'error':
      if (S.thinkId) {
        /* Replace the thinking bubble in-place — no blank second bubble */
        const el = document.getElementById(S.thinkId);
        if (el) {
          const b = el.querySelector('.bub');
          b.style.cssText += ';background:rgba(248,113,113,.06);border-color:rgba(248,113,113,.25)';
          b.innerHTML = `<div class="prose" style="color:var(--error)">&#9888; ${esc(d.content)}</div>`;
        }
        S.thinkId = null;
      } else if (S.streamEl) {
        /* Error mid-stream — show in the current stream bubble */
        S.streamEl.innerHTML = `<span style="color:var(--error)">&#9888; ${esc(d.content)}</span>`;
        const b = S.streamEl.closest('.bub');
        if (b) b.style.cssText += ';border-color:rgba(248,113,113,.25)';
        S.streamEl = null;
      } else {
        showErr(d.content);
      }
      S.currentAiMsg = null;
      S.streaming = false; setInput(true);
      break;

    case 'cleared':
    case 'system_updated':
      S.msgs = [];
      break;

    case 'tools_ready':
      showToolsPanel(d.tools);
      break;

    case 'components_ready':
      showComponentsBadge(d.components);
      break;

    case 'component':
      /* AI returned a component JSON — replace stream with rendered HTML */
      rmThink();
      if (S.streamEl) {
        const msgEl = S.streamEl.closest('.msg.ai');
        if (msgEl) msgEl.remove();
        S.streamEl = null; S.currentAiMsg = null;
      }
      showComponent(d.name, d.html);
      break;
  }
}

/* ── Rendering ───────────────────────────────────────── */
function addMsg(h) { document.getElementById('mlist').insertAdjacentHTML('beforeend', h); }

function appendUser(t) {
  addMsg(`<div class="msg user">
    <div class="av user">You</div>
    <div class="mb">
      <div class="bub"><div class="prose">${esc(t)}</div></div>
      <div class="mmeta"><span class="mt">${now()}</span></div>
    </div>
  </div>`);
  if (S.ascroll) scr();
}

function showThink() {
  const id = 'tk' + Date.now(); S.thinkId = id;
  addMsg(`<div class="msg ai" id="${id}">
    <div class="av ai">AI</div>
    <div class="mb">
      <div class="bub">
        <div class="think">
          <div class="td"></div><div class="td"></div><div class="td"></div>
        </div>
      </div>
    </div>
  </div>`);
  if (S.ascroll) scr();
}

function rmThink() {
  if (!S.thinkId) return;
  const el = document.getElementById(S.thinkId);
  if (!el) return;
  const tid = S.thinkId;
  const b = el.querySelector('.bub');
  b.innerHTML = '<div class="prose"></div>';
  S.streamEl = b.querySelector('.prose');
  S.currentAiMsg = el;
  el.querySelector('.mb').insertAdjacentHTML('beforeend', `
    <div class="mmeta">
      <span class="mt">${now()}</span>
      <span class="tbadge" id="tb${tid}"></span>
    </div>
    <div class="msg-actions" id="ma${tid}">
      <button class="ma-btn" onclick="copyMsg('${tid}')">⎘ Copy</button>
    </div>
  `);
  S.tbEl = document.getElementById('tb' + tid);
  S.thinkId = null;
}

function renderStream(r) {
  if (!S.streamEl) return;
  S.streamEl.innerHTML = marked.parse(r) + '<span class="scur"></span>';
  S.streamEl.querySelectorAll('pre code').forEach(b => { hljs.highlightElement(b); addChdr(b); });
}

function finalise(r, usage) {
  if (S.streamEl && r) {
    S.streamEl.innerHTML = marked.parse(r);
    S.streamEl.querySelectorAll('pre code').forEach(b => { hljs.highlightElement(b); addChdr(b); });
    S.msgs.push({role: 'assistant', content: r});
  }
  if (usage && S.tbEl) S.tbEl.textContent = `${usage.input + usage.output} tok`;

  /* Add ↺ Retry button to the completed message's action row */
  document.querySelectorAll('.ma-btn.regen').forEach(b => b.remove());
  if (S.currentAiMsg) {
    const actions = S.currentAiMsg.querySelector('.msg-actions');
    if (actions) {
      actions.insertAdjacentHTML('beforeend',
        `<button class="ma-btn regen" onclick="regenerate()">↺ Retry</button>`
      );
    }
    S.currentAiMsg = null;
  }
}

/* ── Tool cards ──────────────────────────────────────── */
function showCard(id, name, inputs) {
  const args = Object.entries(inputs).map(([k, v]) =>
    `<div class="tar">
      <span class="tak">${esc(k)}</span>
      <span style="color:var(--tool-arg)">→</span>
      <span class="tav">${esc(JSON.stringify(v))}</span>
    </div>`
  ).join('');
  addMsg(`<div class="tc" id="tc${id}">
    <div class="tch">
      <span style="color:var(--tool-text)">⚡</span>
      <span class="tfn">${esc(name)}()</span>
      <span class="tbg run" id="tbg${id}">running</span>
    </div>
    <div class="tcb" id="tcb${id}"><div>${args}</div></div>
  </div>`);
  if (S.ascroll) scr();
}

function updCard(id, res) {
  const bg = document.getElementById('tbg' + id);
  if (bg) { bg.textContent = 'done'; bg.classList.remove('run'); }
  const cb = document.getElementById('tcb' + id);
  if (!cb) return;
  let disp = res;
  try {
    const p = JSON.parse(res);
    disp = JSON.stringify(p, null, 0);
    if (disp.length > 120) disp = disp.slice(0, 120) + '…';
  } catch (_) {}
  cb.insertAdjacentHTML('beforeend', `
    <hr class="tdiv">
    <div class="trr"><span class="tra">→</span><span class="trv">${esc(disp)}</span></div>
  `);
  if (S.ascroll) scr();
}

/* ── Tools sidebar panel ─────────────────────────────── */
function showToolsPanel(tools) {
  if (!tools || !tools.length) return;
  document.getElementById('sbTools').style.display = 'block';
  document.getElementById('toolsCount').textContent = tools.length;
  document.getElementById('toolsList').innerHTML = tools.map(t => `
    <div class="tool-item">
      <span class="tool-item-icon">⚡</span>
      <div>
        <div class="tool-item-name">${esc(t.name)}()</div>
        ${t.description
          ? `<div class="tool-item-desc">${esc(t.description.slice(0, 70))}${t.description.length > 70 ? '…' : ''}</div>`
          : ''}
      </div>
    </div>
  `).join('');
}

/* ── Component rendering ─────────────────────────────── */
function showComponent(name, html) {
  const wrapper = document.createElement('div');
  wrapper.className = 'comp-card';
  const bodyId = 'cb-' + Date.now();
  wrapper.innerHTML = `
    <div class="comp-head">
      <span class="comp-icon">◈</span>
      <span class="comp-name">${esc(name)}</span>
      <span class="comp-badge">component</span>
    </div>
    <div class="comp-body" id="${bodyId}"></div>`;
  document.getElementById('mlist').appendChild(wrapper);

  /* Execute HTML including <script> tags (required for Chart.js, Plotly, etc.) */
  const body = document.getElementById(bodyId);
  try {
    body.appendChild(document.createRange().createContextualFragment(html));
  } catch (_) {
    body.innerHTML = html;
  }
  if (S.ascroll) scr();
}

function showComponentsBadge(components) {
  if (!components || !components.length) return;
  const panel = document.getElementById('sbTools');
  panel.style.display = 'block';
  const div = document.createElement('div');
  div.innerHTML =
    `<div style="padding:.375rem 1rem .1rem;border-top:1px solid var(--border-subtle);margin-top:.25rem">
      <div class="sb-section-label" style="margin-bottom:.25rem">Components</div>` +
    components.map(c =>
      `<div class="tool-item">
        <span class="tool-item-icon" style="color:var(--text-accent)">◈</span>
        <div><div class="tool-item-name" style="color:var(--text-accent)">${esc(c)}</div></div>
      </div>`).join('') + '</div>';
  panel.appendChild(div);
}

/* ── Copy message ────────────────────────────────────── */
function copyMsg(tid) {
  const el = document.getElementById(tid);
  if (!el) return;
  const prose = el.querySelector('.prose');
  if (!prose) return;
  navigator.clipboard.writeText(prose.innerText).then(() => {
    const btn = el.querySelector('.ma-btn:first-child');
    if (btn) { btn.textContent = '✓ Copied'; setTimeout(() => btn.textContent = '⎘ Copy', 2000); }
  });
}

/* ── Regenerate ──────────────────────────────────────── */
function regenerate() {
  if (S.streaming || !S.connected) return;
  const list = document.getElementById('mlist');
  /* Remove everything from the end back to (but not including) last user message */
  let child = list.lastElementChild;
  while (child) {
    const prev = child.previousElementSibling;
    if (child.classList.contains('msg') && child.classList.contains('user')) break;
    child.remove();
    child = prev;
  }
  /* Remove last assistant entry from local log */
  if (S.msgs.length && S.msgs[S.msgs.length - 1].role === 'assistant') S.msgs.pop();
  ws({action: 'regenerate'});
}

/* ── Code block header ───────────────────────────────── */
function addChdr(b) {
  const pre = b.parentElement;
  if (pre.querySelector('.chdr')) return;
  const lang = (b.className.match(/language-(\w+)/) || [])[1] || 'code';
  const h = document.createElement('div'); h.className = 'chdr';
  h.innerHTML = `<span>${lang}</span><button class="cbtn" onclick="copyCode(this)">Copy</button>`;
  pre.insertBefore(h, b);
}

function showErr(t) {
  addMsg(`<div class="msg ai">
    <div class="av ai">AI</div>
    <div class="mb">
      <div class="bub" style="border-color:rgba(248,113,113,.3)">
        <div class="prose" style="color:var(--error)">⚠ ${esc(t)}</div>
      </div>
    </div>
  </div>`);
  if (S.ascroll) scr();
}

/* ── Input ───────────────────────────────────────────── */
function sendMsg() {
  const inp = document.getElementById('ci'), t = inp.value.trim();
  if (!t || S.streaming || !S.connected) return;
  document.getElementById('welcome').style.display = 'none';
  appendUser(t); S.msgs.push({role: 'user', content: t});
  inp.value = ''; inp.style.height = 'auto';
  ws({action: 'chat', message: t});
}
function chip(t) { document.getElementById('ci').value = t; sendMsg(); }
function setInput(on) {
  const i = document.getElementById('ci'), b = document.getElementById('sb2'), s = document.getElementById('stb');
  i.disabled = !on; b.disabled = !on; s.classList.toggle('vis', !on);
}
function focusI() { document.getElementById('ci').focus(); }
function stopGen() { ws({action: 'stop'}); S.streaming = false; setInput(true); }

/* ── Conversations ───────────────────────────────────── */
function saveConv() {
  if (!S.msgs.length) return;
  const id = S.aid || String(Date.now()); S.aid = id;
  const title = S.msgs[0].content.slice(0, 42);
  const idx = S.convs.findIndex(c => c.id === id);
  const cv = {id, title, updatedAt: Date.now()};
  if (idx >= 0) S.convs[idx] = cv; else S.convs.unshift(cv);
  if (S.convs.length > 30) S.convs = S.convs.slice(0, 30);
  localStorage.setItem('cui2', JSON.stringify(S.convs));
  renderConvs();
}
function renderConvs() {
  const el = document.getElementById('convList');
  if (!S.convs.length) {
    el.innerHTML = '<div style="padding:1rem .75rem;font-size:12px;color:var(--text-tertiary);text-align:center">No conversations yet</div>';
    return;
  }
  el.innerHTML = S.convs.map(c =>
    `<div class="cv${c.id === S.aid ? ' active' : ''}" onclick="loadConv('${c.id}')">${esc(c.title)}…</div>`
  ).join('');
}
function loadConv(id) { S.aid = id; renderConvs(); }
function newChat() {
  S.aid = null; S.msgs = [];
  document.getElementById('mlist').innerHTML = '';
  document.getElementById('welcome').style.display = 'flex';
  ws({action: 'clear'}); renderConvs(); focusI();
}

/* ── System prompt ───────────────────────────────────── */
function toggleSys() { document.getElementById('sysPanel').classList.toggle('open'); }
function saveSystem() {
  const p = document.getElementById('sysTa').value.trim();
  if (!p) return;
  ws({action: 'update_system', prompt: p});
  document.getElementById('sysPanel').classList.remove('open');
  newChat();
}

/* ── Export ──────────────────────────────────────────── */
function exportConv() {
  if (!S.msgs.length) return;
  const md = `# ChatUI Export\n${new Date().toLocaleString()}\n\n---\n\n` +
    S.msgs.map(m => `## ${m.role === 'user' ? 'You' : 'AI'}\n\n${m.content}`).join('\n\n---\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], {type: 'text/markdown'}));
  a.download = `chatui-${Date.now()}.md`; a.click();
}

/* ── Utilities ───────────────────────────────────────── */
function esc(t) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(String(t)));
  return d.innerHTML;
}
function now() { return new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}); }
function scr() { const c = document.getElementById('mwrap'); c.scrollTop = c.scrollHeight; }
function setStatus(on) {
  document.getElementById('sd').className = 'sd' + (on ? '' : ' off');
  document.getElementById('st').textContent = on ? 'Connected' : 'Reconnecting…';
}
function copyCode(btn) {
  navigator.clipboard.writeText(btn.closest('pre').querySelector('code').textContent)
    .then(() => { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 2000); });
}

/* ── Init ────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  connect();
  renderConvs();
  initThemeDots();
  initWelcome();

  /* Font buttons */
  document.querySelectorAll('.font-opt').forEach(btn =>
    btn.addEventListener('click', () => setFont(btn.dataset.font))
  );
  /* Size buttons */
  document.querySelectorAll('.size-opt').forEach(btn =>
    btn.addEventListener('click', () => setSize(btn.dataset.size))
  );
  /* Restore saved preferences */
  const savedFont = localStorage.getItem('cui_font');
  const savedSize = localStorage.getItem('cui_size');
  if (savedFont) setFont(savedFont);
  if (savedSize) setSize(savedSize);

  const inp = document.getElementById('ci');
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });
  inp.addEventListener('input', e => {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
  });

  document.getElementById('sb2').addEventListener('click', sendMsg);
  document.getElementById('stb').addEventListener('click', stopGen);
  document.getElementById('newBtn').addEventListener('click', newChat);
  document.getElementById('sysBtn').addEventListener('click', toggleSys);
  document.getElementById('sysSave').addEventListener('click', saveSystem);
  document.getElementById('expBtn').addEventListener('click', exportConv);
  document.getElementById('mwrap').addEventListener('scroll', () => {
    const c = document.getElementById('mwrap');
    S.ascroll = (c.scrollHeight - c.scrollTop - c.clientHeight < 60);
  });

  focusI();
});
</script>
</body>
