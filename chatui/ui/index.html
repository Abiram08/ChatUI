<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
/*{{STYLES}}*/
</style>
</head>
<body>
<a class="skip-link" href="#ci">Skip to message input</a>
<button class="menu-btn" id="menuBtn" aria-label="Open sidebar menu" title="Menu" aria-controls="sidebar" aria-expanded="false">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>
<div class="sidebar-backdrop" id="sbBackdrop" hidden></div>
<div class="conn-banner" id="connBanner" role="alert" aria-live="assertive">Connection lost — reconnecting automatically…</div>

<div class="app">
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Chat sidebar">
    <div class="sb-head">
      <div class="logo">
        <div class="logo-mark" aria-hidden="true">{{LOGO}}</div>
        <span class="logo-text">{{TITLE}}</span>
      </div>
      <div class="model-badge" id="modelBadge" title="Provider status" role="status" aria-live="polite">
        <span id="st">Connecting…</span>
      </div>
      <div class="sb-actions">
        <button class="sb-btn primary" id="newBtn" aria-label="Start new conversation">New chat</button>
        <button class="sb-btn" id="sysBtn" aria-label="Open settings" aria-controls="sysPanel" aria-expanded="false">Settings</button>
      </div>
    </div>

    <div class="sys-panel" id="sysPanel" aria-hidden="true" role="region" aria-label="Settings">
      <div class="sys-inner">
        <div class="setting-block">
          <label class="sb-section-label" for="themeSelect">Theme</label>
          <select class="theme-select" id="themeSelect" aria-label="Select color theme"></select>
        </div>
        <div class="setting-block">
          <div class="sb-section-label" id="fontLabel">Typeface</div>
          <div class="font-opts" role="group" aria-labelledby="fontLabel">
            <button type="button" class="font-opt active" data-font="sans" aria-pressed="true">Sora</button>
            <button type="button" class="font-opt" data-font="serif" aria-pressed="false">Serif</button>
            <button type="button" class="font-opt" data-font="mono" aria-pressed="false">Mono</button>
          </div>
        </div>
        <div class="setting-block">
          <div class="sb-section-label" id="sizeLabel">Text size</div>
          <div class="size-opts" role="group" aria-labelledby="sizeLabel">
            <button type="button" class="size-opt" data-size="sm" aria-label="Small text" aria-pressed="false">A</button>
            <button type="button" class="size-opt active" data-size="md" aria-label="Medium text" aria-pressed="true">A</button>
            <button type="button" class="size-opt" data-size="lg" aria-label="Large text" aria-pressed="false">A</button>
          </div>
        </div>
        <div class="setting-block">
          <label class="sb-section-label" for="sysTa">System prompt</label>
          <textarea class="sys-ta" id="sysTa" placeholder="You are a helpful assistant…" aria-label="System prompt"></textarea>
          <button type="button" class="sys-save" id="sysSave">Apply prompt</button>
        </div>
      </div>
    </div>

    <div class="sb-tools" id="sbTools" style="display:none" role="region" aria-label="Available tools">
      <div class="sb-tools-head">
        <div class="sb-section-label" id="toolsLabel">Tools</div>
        <span class="tools-count" id="toolsCount" aria-labelledby="toolsLabel"></span>
      </div>
      <div id="toolsList"></div>
    </div>

    <div class="sb-convs" id="convList" role="list" aria-label="Past conversations">
      <div class="sb-empty">
        <div class="sb-empty-title">No chats yet</div>
        <div class="sb-empty-sub">Start a conversation — it will show up here so you can return later.</div>
      </div>
    </div>

    <div class="sb-foot">
      <span class="sb-foot-text" id="sbFootText">ChatUI</span>
      <div class="sb-foot-actions">
        <button type="button" class="ib" id="impBtn" title="Import conversation" aria-label="Import conversation">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        </button>
        <button type="button" class="ib" id="expBtn" title="Export as Markdown" aria-label="Export conversation as Markdown">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="main" id="main" role="main">
    <div class="mwrap" id="mwrap">
      <div class="welcome" id="welcome" aria-labelledby="welcomeHeading">
        <div class="welcome-kicker">{{TITLE}}</div>
        <h1 class="welcome-title" id="welcomeHeading">{{WELCOME_TITLE}}</h1>
        <div class="welcome-rule" aria-hidden="true"></div>
        <p class="welcome-sub" id="welcomeSub"></p>
        <div class="chips" id="chipsRow" role="group" aria-label="Suggested prompts"></div>
      </div>
      <div class="mlist" id="mlist" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation"></div>
    </div>

    <div class="ia">
      <div class="iaw">
        <div class="iw" role="group" aria-label="Message composer">
          <textarea id="ci" class="ci" placeholder="Message {{TITLE}}…" rows="1" maxlength="12000" aria-label="Chat input"></textarea>
          <button class="stb" id="stb" title="Stop generation" aria-label="Stop generating">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          </button>
          <button class="sb2" id="sb2" title="Send message" aria-label="Send message">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
        </div>
        <div class="ih"><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline · <kbd>Esc</kbd> stop</div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>
<script>
/* ════════════════════════════════════════════════════════════════════════════
   ChatUI — Frontend Application
   ════════════════════════════════════════════════════════════════════════════ */

marked.setOptions({ breaks: true, gfm: true });

/* ── Template data ─────────────────────────────────────── */
const THEME_DATA   = {{THEMES_JSON}};
const ACTIVE_THEME = '{{ACTIVE_THEME}}';
const AUTH_TOKEN   = '{{AUTH_TOKEN}}';
const MAX_FILE_MB  = 2;

const THEME_LABELS = {
  manuscript: 'Manuscript', atoll: 'Atoll', grain: 'Grain',
  ink: 'Ink', obsidian: 'Obsidian', nocturne: 'Nocturne',
  rose: 'Rose', mint: 'Mint', midnight: 'Midnight',
};

function buildWsUrl() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const q = AUTH_TOKEN ? `?token=${encodeURIComponent(AUTH_TOKEN)}` : '';
  return `${proto}://${location.host}/ws${q}`;
}
const WS_URL = buildWsUrl();

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
const S = {
  ws: null, connected: false, streaming: false, retries: 0,
  streamEl: null, raw: '', thinkId: null, tbEl: null,
  currentAiMsg: null,
  convs: (() => { try { return JSON.parse(localStorage.getItem('cui3') || '[]'); } catch (_) { return []; } })(),
  msgHistory: [],
  aid: null, ascroll: true,
  session: {},
};

/* ═══════════════════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════════════════ */
const esc = t => { const d = document.createElement('div'); d.textContent = String(t); return d.innerHTML; };
const now = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const scr = () => { const c = document.getElementById('mwrap'); c.scrollTop = c.scrollHeight; };
const mlist = () => document.getElementById('mlist');
const addEl = h => {
  const t = document.createElement('template');
  t.innerHTML = h.trim();
  const frag = t.content;
  mlist().appendChild(frag);
};

/* ═══════════════════════════════════════════════════════════
   WEBSOCKET
   ═══════════════════════════════════════════════════════════ */
function connect() {
  if (S.ws && (S.ws.readyState === 0 || S.ws.readyState === 1)) return;
  S.ws = new WebSocket(WS_URL);
  S.ws.onopen = () => { S.connected = true; S.retries = 0; setStatus(true); };
  S.ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch(err) { console.error('Parse error:', err); } };
  S.ws.onclose = (ev) => {
    S.connected = false;
    setStatus(false);
    if (ev && ev.code === 4001) {
      document.getElementById('st').textContent = 'Unauthorized';
      return;
    }
    if (S.retries < 10) {
      S.retries++;
      setTimeout(connect, Math.min(1000 * Math.pow(1.5, S.retries), 15000));
    }
  };
  S.ws.onerror = () => { S.connected = false; setStatus(false); };
}

function ws(o) { if (S.ws && S.ws.readyState === 1) S.ws.send(JSON.stringify(o)); }

function setStatus(on) {
  const badge = document.getElementById('modelBadge');
  const banner = document.getElementById('connBanner');
  badge.classList.toggle('off', !on);
  document.getElementById('st').textContent = on ? 'Connected' : 'Reconnecting...';
  banner.classList.toggle('show', !on);
}

/* ═══════════════════════════════════════════════════════════
   MESSAGE HANDLER
   ═══════════════════════════════════════════════════════════ */
function handle(d) {
  switch (d.type) {

    case 'config':
      document.getElementById('st').textContent = `${d.provider} · ${d.model}`;
      if (d.session) S.session._id = d.session;
      break;

    case 'session_state':
    case 'session_updated':
      S.session = { ...S.session, ...(d.data || {}) };
      if (d.key) S.session[d.key] = d.value;
      break;

    case 'start':
    case 'start_again':
      if (d.type === 'start') S.raw = '';
      showThink(); S.streaming = true; setInput(false);
      break;

    case 'token':
      rmThink(); S.raw += d.content; renderStream(S.raw);
      if (S.ascroll) scr();
      break;

    case 'tool_call':
      rmThink(); showToolCard(d.id, d.name, d.inputs);
      break;

    case 'tool_result':
      updateToolCard(d.id, d.result, d.name);
      break;

    case 'widgets':
      if (d.widgets) renderWidgetGroup(d.widgets);
      break;

    case 'end':
      finalise(S.raw, d.usage);
      S.streaming = false; S.streamEl = null; S.raw = ''; S.tbEl = null;
      setInput(true); focusI(); saveConv();
      break;

    case 'stopped':
      rmThink(); finalise(S.raw, null);
      S.streaming = false; S.streamEl = null; S.raw = ''; S.tbEl = null;
      S.currentAiMsg = null;
      setInput(true); focusI();
      break;

    case 'error':
      if (S.thinkId) {
        const el = document.getElementById(S.thinkId);
        if (el) {
          const b = el.querySelector('.bub');
          b.style.cssText += ';background:color-mix(in oklch, var(--error) 8%, var(--bg-surface));border-color:color-mix(in oklch, var(--error) 30%, var(--border));';
          b.innerHTML = `<div class="prose" style="color:var(--error)" role="alert">&#9888; ${esc(d.content)}</div>`;
        }
        S.thinkId = null;
      } else if (S.streamEl) {
        S.streamEl.innerHTML = `<span style="color:var(--error)" role="alert">&#9888; ${esc(d.content)}</span>`;
        S.streamEl = null;
      } else {
        showErr(d.content);
      }
      S.currentAiMsg = null;
      S.streaming = false; setInput(true);
      break;

    case 'cleared':
    case 'system_updated':
      S.msgHistory = [];
      break;

    case 'tools_ready':
      showToolsPanel(d.tools);
      break;

    case 'components_ready':
      showComponentsPanel(d.components);
      break;

    case 'component':
      rmThink();
      if (S.streamEl) {
        const msgEl = S.streamEl.closest('.msg.ai');
        if (msgEl) msgEl.remove();
        S.streamEl = null; S.currentAiMsg = null;
      }
      showComponent(d.name, d.html);
      break;
  }
}

/* ═══════════════════════════════════════════════════════════
   MESSAGE RENDERING
   ═══════════════════════════════════════════════════════════ */
function appendUser(t) {
  addEl(`<div class="msg user"><div class="av user" aria-label="You"><span aria-hidden="true">You</span></div><div class="mb"><div class="bub"><div class="prose">${esc(t)}</div></div><div class="mmeta"><span class="mt">${now()}</span></div></div></div>`);
  if (S.ascroll) scr();
}

function showThink() {
  const id = 'tk' + Date.now(); S.thinkId = id;
  addEl(`<div class="msg ai" id="${id}"><div class="av ai" aria-label="AI"><span aria-hidden="true">◆</span></div><div class="mb"><div class="bub bub-ghost"><div class="think" aria-label="Thinking"><span class="think-pulse"></span><span class="think-label">Thinking</span></div></div></div></div>`);
  if (S.ascroll) scr();
}

function rmThink() {
  if (!S.thinkId) return;
  const el = document.getElementById(S.thinkId);
  if (!el) return;
  const tid = S.thinkId;
  const b = el.querySelector('.bub');
  b.innerHTML = '<div class="prose"></div>';
  S.streamEl = b.querySelector('.prose');
  S.currentAiMsg = el;
  el.querySelector('.mb').insertAdjacentHTML('beforeend', `
    <div class="mmeta"><span class="mt">${now()}</span><span class="tbadge" id="tb${tid}"></span></div>
    <div class="msg-actions" id="ma${tid}">
      <button class="ma-btn" onclick="copyMsg('${tid}')" aria-label="Copy message">Copy</button>
    </div>
  `);
  const bub = el.querySelector('.bub');
  if (bub) bub.classList.remove('bub-ghost');
  S.tbEl = document.getElementById('tb' + tid);
  S.thinkId = null;
}

function renderStream(r) {
  if (!S.streamEl) return;
  S.streamEl.innerHTML = marked.parse(r) + '<span class="scur" aria-hidden="true"></span>';
  S.streamEl.querySelectorAll('pre code').forEach(b => { hljs.highlightElement(b); addCodeHeader(b); });
}

function finalise(r, usage) {
  if (S.streamEl && r) {
    S.streamEl.innerHTML = marked.parse(r);
    S.streamEl.querySelectorAll('pre code').forEach(b => { hljs.highlightElement(b); addCodeHeader(b); });
    S.msgHistory.push({ role: 'assistant', content: r });
  }
  if (usage && S.tbEl) S.tbEl.textContent = `${usage.input + usage.output} tok`;
  document.querySelectorAll('.ma-btn.regen').forEach(b => b.remove());
  if (S.currentAiMsg) {
    const actions = S.currentAiMsg.querySelector('.msg-actions');
    if (actions) {
      actions.insertAdjacentHTML('beforeend', `<button class="ma-btn regen" onclick="regenerate()" aria-label="Regenerate response">Regenerate</button>`);
    }
    const el = S.currentAiMsg;
    el.querySelectorAll('.prose a').forEach(a => { a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener noreferrer'); });
    S.currentAiMsg = null;
  }
}

function showErr(t) {
  addEl(`<div class="msg ai"><div class="av ai" aria-label="AI"><span aria-hidden="true">◆</span></div><div class="mb"><div class="bub bub-error"><div class="prose" role="alert">${esc(t)}</div></div></div></div>`);
  if (S.ascroll) scr();
}

/* ═══════════════════════════════════════════════════════════
   TOOL CARDS
   ═══════════════════════════════════════════════════════════ */
function showToolCard(id, name, inputs) {
  const args = Object.entries(inputs || {}).map(([k, v]) =>
    `<div class="tar"><span class="tak">${esc(k)}</span><span class="tav">${esc(JSON.stringify(v))}</span></div>`
  ).join('');
  addEl(`<div class="tc" id="tc${id}"><div class="tch"><span class="tfn">${esc(name)}</span><span class="tbg run" id="tbg${id}">Running</span></div><div class="tcb" id="tcb${id}">${args || '<div class="tar muted">No arguments</div>'}</div></div>`);
  if (S.ascroll) scr();
}

function updateToolCard(id, res, name) {
  const bg = document.getElementById('tbg' + id);
  if (bg) { bg.textContent = 'Done'; bg.classList.remove('run'); bg.classList.add('done'); }
  const cb = document.getElementById('tcb' + id);
  if (!cb) return;
  let disp = res;
  try { const p = JSON.parse(res); disp = JSON.stringify(p, null, 0); if (disp.length > 200) disp = disp.slice(0, 200) + '\u2026'; } catch (_) {}
  cb.insertAdjacentHTML('beforeend', `<div class="tdiv"></div><div class="trr"><span class="tra">result</span><span class="trv">${esc(disp)}</span></div>`);
  if (S.ascroll) scr();
}

/* ═══════════════════════════════════════════════════════════
   COMPONENTS
   ═══════════════════════════════════════════════════════════ */
function showComponent(name, html) {
  const wrapper = document.createElement('div');
  wrapper.className = 'comp-card';
  const bodyId = 'cb-' + Date.now();
  wrapper.innerHTML = `<div class="comp-head"><span class="comp-name">${esc(name)}</span><span class="comp-badge">Component</span></div><div class="comp-body" id="${bodyId}"></div>`;
  mlist().appendChild(wrapper);
  const body = document.getElementById(bodyId);
  try { body.appendChild(document.createRange().createContextualFragment(html)); } catch (_) { body.innerHTML = html; }
  if (S.ascroll) scr();
}

function showToolsPanel(tools) {
  if (!tools || !tools.length) return;
  document.getElementById('sbTools').style.display = 'block';
  document.getElementById('toolsCount').textContent = tools.length;
  document.getElementById('toolsList').innerHTML = tools.map(t =>
    `<div class="tool-item"><div class="tool-item-dot" aria-hidden="true"></div><div><div class="tool-item-name">${esc(t.name)}</div>${t.description ? `<div class="tool-item-desc">${esc(t.description.slice(0, 70))}${t.description.length > 70 ? '\u2026' : ''}</div>` : ''}</div></div>`
  ).join('');
}

function showComponentsPanel(components) {
  if (!components || !components.length) return;
  const panel = document.getElementById('sbTools');
  panel.style.display = 'block';
  const div = document.createElement('div');
  div.innerHTML = `<div style="padding:.375rem 1.25rem .1rem;border-top:1px solid var(--border);margin-top:.25rem"><div class="sb-section-label" style="margin-bottom:.25rem">Components</div>` + components.map(c => `<div class="tool-item"><span class="tool-item-icon" style="color:var(--accent)" aria-hidden="true">\u25C8</span><div><div class="tool-item-name" style="color:var(--accent)">${esc(c)}</div></div></div>`).join('') + '</div>';
  panel.appendChild(div);
}

/* ═══════════════════════════════════════════════════════════
   WIDGET SYSTEM
   Layout-first: group buttons / metrics, use fr columns, flat shells
   ═══════════════════════════════════════════════════════════ */
const FLAT_WIDGETS = new Set(['button', 'divider', 'spinner']);

function renderWidgetGroup(widgets) {
  if (!widgets || !widgets.length) return;
  let i = 0;
  while (i < widgets.length) {
    const w = widgets[i];
    if (w.widget === 'columns') {
      const ratios = w.props.ratios || [1, 1];
      const n = ratios.length;
      const kids = [];
      i++;
      while (i < widgets.length && widgets[i].widget !== 'columns_end' && kids.length < n) {
        if (widgets[i].widget === 'columns' || widgets[i].widget === 'expander') break;
        kids.push(widgets[i]);
        i++;
      }
      if (i < widgets.length && widgets[i].widget === 'columns_end') i++;
      renderColumns(ratios, kids);
      continue;
    }
    if (w.widget === 'expander') {
      const body = [];
      i++;
      while (i < widgets.length && widgets[i].widget !== 'expander_end') {
        body.push(widgets[i]);
        i++;
      }
      if (i < widgets.length && widgets[i].widget === 'expander_end') i++;
      renderExpander(w, body);
      continue;
    }
    if (w.widget === 'columns_end' || w.widget === 'expander_end') {
      i++;
      continue;
    }
    if (w.widget === 'toast') {
      showToast(w.props.message, w.props.icon || 'info');
      i++;
      continue;
    }
    /* Consecutive buttons → single action row (centered label, shared gap) */
    if (w.widget === 'button') {
      const btns = [];
      while (i < widgets.length && widgets[i].widget === 'button') {
        btns.push(widgets[i]);
        i++;
      }
      renderButtonGroup(btns);
      continue;
    }
    /* Consecutive metrics → responsive metric strip */
    if (w.widget === 'metric') {
      const metrics = [];
      while (i < widgets.length && widgets[i].widget === 'metric') {
        metrics.push(widgets[i]);
        i++;
      }
      renderMetricGroup(metrics);
      continue;
    }
    renderWidget(w);
    i++;
  }
}

function mountWidget(parent, w) {
  const wrap = document.createElement('div');
  wrap.innerHTML = buildWidgetHTML(w);
  bindWidgetEvents(wrap, w);
  while (wrap.firstChild) parent.appendChild(wrap.firstChild);
}

function renderButtonGroup(btns) {
  if (!btns.length) return;
  const card = document.createElement('div');
  card.className = 'widget-card flat';
  const row = document.createElement('div');
  row.className = 'w-actions';
  row.setAttribute('role', 'group');
  row.setAttribute('aria-label', 'Actions');
  btns.forEach(w => mountWidget(row, w));
  card.appendChild(row);
  mlist().appendChild(card);
  if (S.ascroll) scr();
}

function renderMetricGroup(metrics) {
  if (!metrics.length) return;
  if (metrics.length === 1) {
    renderWidget(metrics[0]);
    return;
  }
  const card = document.createElement('div');
  card.className = 'widget-card';
  const grid = document.createElement('div');
  grid.className = 'w-metrics';
  metrics.forEach(w => {
    const cell = document.createElement('div');
    cell.innerHTML = buildWidgetHTML(w);
    grid.appendChild(cell);
  });
  card.appendChild(grid);
  mlist().appendChild(card);
  if (S.ascroll) scr();
}

function renderColumns(ratios, kids) {
  const grid = document.createElement('div');
  grid.className = 'widget-card w-columns';
  grid.style.gridTemplateColumns = (ratios || [1, 1]).map(r => `${Number(r) || 1}fr`).join(' ');
  kids.forEach(w => {
    const cell = document.createElement('div');
    if (w.widget === 'button') {
      const row = document.createElement('div');
      row.className = 'w-actions';
      mountWidget(row, w);
      cell.appendChild(row);
    } else {
      mountWidget(cell, w);
    }
    grid.appendChild(cell);
  });
  mlist().appendChild(grid);
  if (S.ascroll) scr();
}

function renderExpander(w, kids) {
  const card = document.createElement('div');
  card.className = 'widget-card';
  card.innerHTML = buildWidgetHTML(w);
  const body = card.querySelector('.w-expander-body');
  kids.forEach(child => {
    const wrap = document.createElement('div');
    if (child.widget === 'button') {
      wrap.className = 'w-actions';
    }
    mountWidget(wrap, child);
    if (body) body.appendChild(wrap);
  });
  mlist().appendChild(card);
  if (S.ascroll) scr();
}

function renderWidget(wd) {
  if (!wd || wd.widget === 'toast') {
    if (wd && wd.widget === 'toast') showToast(wd.props.message, wd.props.icon || 'info');
    return;
  }
  const card = document.createElement('div');
  card.className = 'widget-card' + (FLAT_WIDGETS.has(wd.widget) ? ' flat' : '');
  card.dataset.widgetId = wd.id;
  if (wd.widget === 'button') {
    const row = document.createElement('div');
    row.className = 'w-actions';
    mountWidget(row, wd);
    card.appendChild(row);
  } else {
    card.innerHTML = buildWidgetHTML(wd);
    bindWidgetEvents(card, wd);
  }
  mlist().appendChild(card);
  if (S.ascroll) scr();
}

function buildWidgetHTML(w) {
  switch (w.widget) {

    case 'button':
      return `<button class="w-btn ${esc(w.props.variant || 'primary')}" data-widget-action="button_click" data-widget-key="${esc(w.props.key || '')}" ${w.props.disabled ? 'disabled' : ''}>${esc(w.props.label)}</button>`;

    case 'text_input':
      return `<div class="w-input-group"><label class="w-input-label">${esc(w.props.label)}</label><div class="w-input-field"><input type="text" class="w-input" data-widget-key="${esc(w.props.key)}" placeholder="${esc(w.props.placeholder || '')}" value="${esc(w.props.value || '')}" aria-label="${esc(w.props.label)}"><button class="w-input-submit" data-widget-action="text_input_submit" data-widget-key="${esc(w.props.key)}">Send</button></div></div>`;

    case 'selectbox':
      return `<div class="w-select"><label class="w-input-label">${esc(w.props.label)}</label><select data-widget-action="selectbox_change" data-widget-key="${esc(w.props.key)}">${(w.props.options || []).map((o, i) => `<option value="${esc(o)}" ${i === (w.props.index || 0) ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;

    case 'radio':
      return `<div class="w-radios"><label class="w-input-label">${esc(w.props.label)}</label>${(w.props.options || []).map((o, i) => `<label class="w-radio-opt"><input type="radio" name="${esc(w.props.key)}" value="${esc(o)}" ${i === (w.props.index || 0) ? 'checked' : ''} data-widget-action="radio_change" data-widget-key="${esc(w.props.key)}">${esc(o)}</label>`).join('')}</div>`;

    case 'checkbox':
      return `<div class="w-checkbox-group"><label class="w-checkbox-opt"><input type="checkbox" data-widget-action="checkbox_change" data-widget-key="${esc(w.props.key)}" ${w.props.value ? 'checked' : ''}>${esc(w.props.label)}</label></div>`;

    case 'slider':
      return `<div class="w-slider-group"><label class="w-input-label">${esc(w.props.label)} <span class="w-slider-val" id="sv_${w.id}" style="margin-left:8px">${w.props.value}</span></label><input type="range" min="${w.props.min}" max="${w.props.max}" step="${w.props.step}" value="${w.props.value}" data-widget-action="slider_change" data-widget-key="${esc(w.props.key)}" oninput="document.getElementById('sv_${w.id}').textContent = this.value"></div>`;

    case 'progress':
      const pct = Math.round((w.props.value || 0) * 100);
      return `<div class="w-progress">${w.props.label ? '<div class="w-progress-label"><span>' + esc(w.props.label) + '</span><span>' + pct + '%</span></div>' : ''}<div class="w-progress-bar"><div class="w-progress-fill" style="width:${pct}%"></div></div></div>`;

    case 'status':
      return `<div class="w-status ${w.props.expanded ? 'open' : ''}" data-widget-id="${w.id}"><button type="button" class="w-status-head" aria-expanded="${w.props.expanded ? 'true' : 'false'}" onclick="const p=this.parentElement;const o=!p.classList.contains('open');p.classList.toggle('open',o);this.setAttribute('aria-expanded',String(o))"><span class="w-status-dot ${esc(w.props.state)}" aria-hidden="true"></span><span>${esc(w.props.label)}</span><span class="w-status-state">${esc(w.props.state)}</span></button><div class="w-status-body"></div></div>`;

    case 'table':
      const cols = (w.props.columns || []).map(c => `<th>${esc(c)}</th>`).join('');
      const rows = (w.props.rows || []).map(r => `<tr>${r.map(c => `<td>${esc(String(c))}</td>`).join('')}</tr>`).join('');
      return `<div class="w-table-wrapper">${w.props.caption ? `<div class="w-table-caption">${esc(w.props.caption)}</div>` : ''}<table class="w-table"><thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table></div>`;

    case 'markdown':
      return `<div class="prose">${marked.parse(w.props.content || '')}</div>`;

    case 'html':
      return `<div class="widget-html-content">${w.props.content || ''}</div>`;

    case 'image':
      return `<figure style="margin:0.5rem 0">${w.props.src ? `<img src="${esc(w.props.src)}" alt="${esc(w.props.caption || '')}" style="max-width:${w.props.width ? w.props.width + 'px' : '100%'};border-radius:var(--radius-sm)">` : ''}${w.props.caption ? `<figcaption style="font-size:11px;color:var(--text-tertiary);margin-top:4px">${esc(w.props.caption)}</figcaption>` : ''}</figure>`;

    case 'divider':
      return '<hr class="w-divider">';

    case 'metric':
      return `<div class="w-metric"><div class="w-metric-label">${esc(w.props.label)}</div><div class="w-metric-val">${esc(String(w.props.value))}</div>${w.props.delta ? `<div class="w-metric-delta ${String(w.props.delta).startsWith('+') ? 'up' : String(w.props.delta).startsWith('-') ? 'down' : ''}">${esc(w.props.delta)}</div>` : ''}</div>`;

    case 'columns':
      const colFr = (w.props.ratios || [1, 1]).map(r => `${Number(r) || 1}fr`).join(' ');
      return `<div class="w-columns" style="grid-template-columns:${colFr}" data-cols="open"></div>`;

    case 'columns_end':
      return '';

    case 'expander':
      return `<div class="w-expander ${w.props.expanded ? 'open' : ''}"><button type="button" class="w-expander-head" aria-expanded="${w.props.expanded ? 'true' : 'false'}" onclick="const p=this.parentElement;const o=!p.classList.contains('open');p.classList.toggle('open',o);this.setAttribute('aria-expanded',String(o))"><span class="w-expander-arrow" aria-hidden="true">\u25B6</span><span>${esc(w.props.label)}</span></button><div class="w-expander-body"></div></div>`;

    case 'expander_end':
      return '';

    case 'toast':
      return '';

    case 'file_uploader':
      return `<div class="w-uploader" data-widget-action="file_upload" data-widget-key="${esc(w.props.key)}" data-accept="${esc(w.props.accept || '')}" data-multiple="${w.props.multiple ? 'true' : 'false'}"><div class="w-uploader-label">${esc(w.props.label)}</div><div class="w-uploader-hint">Drop a file here, or click to browse · max ${MAX_FILE_MB} MB each</div><div class="w-uploader-files"></div><input type="file" accept="${esc(w.props.accept || '')}" ${w.props.multiple ? 'multiple' : ''}></div>`;

    case 'spinner':
      return `<div class="w-spinner" role="status" aria-live="polite"><div class="w-spinner-dot" aria-hidden="true"></div><span>${esc(w.props.label || 'Working on it…')}</span></div>`;

    default:
      return '';
  }
}

function bindWidgetEvents(card, w) {
  if (!w) return;

  card.querySelectorAll('[data-widget-action]').forEach(el => {
    const action = el.dataset.widgetAction;
    const key = el.dataset.widgetKey || w.props.key || '';

    if (action === 'button_click') {
      el.addEventListener('click', () => {
        ws({ action: 'widget_event', event: 'button_click', widget_id: w.id, key, value: true, data: { key } });
      });
    } else if (action === 'text_input_submit') {
      el.addEventListener('click', () => {
        const input = card.querySelector('input[data-widget-key]');
        const val = input ? input.value : '';
        ws({ action: 'widget_event', event: 'text_input_submit', widget_id: w.id, key, value: val, data: { key, value: val } });
      });
    } else if (action === 'selectbox_change') {
      el.addEventListener('change', () => {
        ws({ action: 'widget_event', event: 'selectbox_change', widget_id: w.id, key, value: el.value, data: { key, value: el.value } });
      });
    } else if (action === 'radio_change') {
      el.addEventListener('change', () => {
        if (el.checked) {
          ws({ action: 'widget_event', event: 'radio_change', widget_id: w.id, key, value: el.value, data: { key, value: el.value } });
        }
      });
    } else if (action === 'checkbox_change') {
      el.addEventListener('change', () => {
        ws({ action: 'widget_event', event: 'checkbox_change', widget_id: w.id, key, value: el.checked, data: { key, value: el.checked } });
      });
    } else if (action === 'slider_change') {
      el.addEventListener('change', () => {
        ws({ action: 'widget_event', event: 'slider_change', widget_id: w.id, key, value: parseFloat(el.value), data: { key, value: parseFloat(el.value) } });
      });
    } else if (action === 'file_upload') {
      const uploader = el;
      const input = uploader.querySelector('input[type="file"]');
      uploader.addEventListener('click', () => input.click());
      uploader.addEventListener('dragover', e => { e.preventDefault(); uploader.classList.add('dragover'); });
      uploader.addEventListener('dragleave', () => uploader.classList.remove('dragover'));
      uploader.addEventListener('drop', e => {
        e.preventDefault(); uploader.classList.remove('dragover');
        handleFiles(e.dataTransfer.files, w, uploader);
      });
      input.addEventListener('change', () => {
        handleFiles(input.files, w, uploader);
      });
    }
  });
}

function handleFiles(files, w, uploader) {
  if (!files || !files.length) return;
  const maxBytes = MAX_FILE_MB * 1024 * 1024;
  const list = Array.from(files).slice(0, 10);
  const tooBig = list.filter(f => f.size > maxBytes);
  if (tooBig.length) {
    showToast(`File too large (max ${MAX_FILE_MB} MB): ${tooBig[0].name}`, 'error');
    return;
  }
  const names = list.map(f => f.name).join(', ');
  const filesDisplay = uploader.querySelector('.w-uploader-files');
  if (filesDisplay) filesDisplay.textContent = 'Selected: ' + names;
  const readers = list.map(file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve({ name: file.name, type: file.type, size: file.size, content: e.target.result });
    reader.onerror = () => reject(new Error('Failed to read ' + file.name));
    reader.readAsDataURL(file);
  }));
  Promise.all(readers).then(results => {
    ws({ action: 'widget_event', event: 'file_upload', widget_id: w.id, key: w.props.key, value: names, data: { key: w.props.key, files: results } });
  }).catch(err => showToast(err.message || 'Upload failed', 'error'));
}

/* ═══════════════════════════════════════════════════════════
   TOASTS
   ═══════════════════════════════════════════════════════════ */
function showToast(message, icon) {
  const container = document.getElementById('toastContainer');
  const icons = { info: '\u2139\ufe0f', success: '\u2705', warning: '\u26a0\ufe0f', error: '\u274c' };
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<span class="toast-icon ${icon}">${icons[icon] || icons.info}</span><span>${esc(message)}</span>`;
  container.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 4000);
}

/* ═══════════════════════════════════════════════════════════
   CODE BLOCKS
   ═══════════════════════════════════════════════════════════ */
function addCodeHeader(b) {
  const pre = b.parentElement;
  if (pre.querySelector('.chdr')) return;
  const lang = (b.className.match(/language-(\w+)/) || [])[1] || 'code';
  const h = document.createElement('div');
  h.className = 'chdr';
  h.innerHTML = `<span>${lang}</span><button class="cbtn" onclick="copyCode(this)" aria-label="Copy code">Copy</button>`;
  pre.insertBefore(h, b);
}

function copyCode(btn) {
  const code = btn.closest('pre').querySelector('code');
  if (!code) return;
  navigator.clipboard.writeText(code.textContent).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1800);
  }).catch(() => {});
}

/* ═══════════════════════════════════════════════════════════
   MESSAGE ACTIONS
   ═══════════════════════════════════════════════════════════ */
function copyMsg(tid) {
  const el = document.getElementById(tid);
  if (!el) return;
  const prose = el.querySelector('.prose');
  if (!prose) return;
  navigator.clipboard.writeText(prose.innerText).then(() => {
    const btn = el.querySelector('.ma-btn:first-child');
    if (btn) { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1800); }
  }).catch(() => {});
}

function regenerate() {
  if (S.streaming || !S.connected) return;
  const list = mlist();
  let child = list.lastElementChild;
  while (child) {
    const prev = child.previousElementSibling;
    if (child.classList.contains('msg') && child.classList.contains('user')) break;
    child.remove();
    child = prev;
  }
  if (S.msgHistory.length && S.msgHistory[S.msgHistory.length - 1].role === 'assistant') S.msgHistory.pop();
  ws({ action: 'regenerate' });
}

/* ═══════════════════════════════════════════════════════════
   INPUT
   ═══════════════════════════════════════════════════════════ */
function sendMsg() {
  const inp = document.getElementById('ci');
  const t = inp.value.trim();
  if (!t || S.streaming || !S.connected) return;
  if (t.length > 12000) {
    showToast('Message too long (max 12,000 characters)', 'warning');
    return;
  }
  document.getElementById('welcome').style.display = 'none';
  appendUser(t);
  S.msgHistory.push({ role: 'user', content: t });
  inp.value = ''; inp.style.height = 'auto';
  ws({ action: 'chat', message: t });
}

function chip(t) { document.getElementById('ci').value = t; sendMsg(); }

function setInput(on) {
  const i = document.getElementById('ci');
  const b = document.getElementById('sb2');
  const s = document.getElementById('stb');
  i.disabled = !on;
  b.disabled = !on;
  s.classList.toggle('vis', !on);
}

function focusI() { document.getElementById('ci').focus(); }

function stopGen() { ws({ action: 'stop' }); S.streaming = false; setInput(true); }

/* ═══════════════════════════════════════════════════════════
   CONVERSATIONS
   ═══════════════════════════════════════════════════════════ */
function saveConv() {
  if (!S.msgHistory.length) return;
  const id = S.aid || String(Date.now()); S.aid = id;
  const first = S.msgHistory.find(m => m.role === 'user');
  const title = ((first && first.content) || 'New conversation').slice(0, 50);
  const idx = S.convs.findIndex(c => c.id === id);
  const cv = { id, title, updatedAt: Date.now() };
  if (idx >= 0) S.convs[idx] = cv; else S.convs.unshift(cv);
  if (S.convs.length > 50) {
    S.convs.slice(50).forEach(old => localStorage.removeItem('cui_msgs_' + old.id));
    S.convs = S.convs.slice(0, 50);
  }
  try {
    localStorage.setItem('cui3', JSON.stringify(S.convs));
    localStorage.setItem('cui_msgs_' + id, JSON.stringify(S.msgHistory));
  } catch (_) { /* quota */ }
  renderConvs();
}

function renderConvs() {
  const el = document.getElementById('convList');
  if (!S.convs.length) {
    el.innerHTML = '<div class="sb-empty"><div class="sb-empty-title">No chats yet</div><div class="sb-empty-sub">Start a conversation — it will show up here so you can return later.</div></div>';
    return;
  }
  el.innerHTML = S.convs.map(c =>
    `<div class="cv${c.id === S.aid ? ' active' : ''}" onclick="loadConv('${c.id}')">${esc(c.title)}<button class="cv-del-btn" onclick="event.stopPropagation();deleteConv('${c.id}')" aria-label="Delete conversation">&times;</button></div>`
  ).join('');
}

function loadConv(id) {
  if (S.streaming) return;
  let msgs = [];
  try { msgs = JSON.parse(localStorage.getItem('cui_msgs_' + id) || '[]'); } catch (_) { msgs = []; }
  S.aid = id;
  S.msgHistory = Array.isArray(msgs) ? msgs : [];
  mlist().innerHTML = '';
  document.getElementById('welcome').style.display = S.msgHistory.length ? 'none' : 'flex';
  S.msgHistory.forEach(m => {
    if (m.role === 'user') appendUser(m.content || '');
    else if (m.role === 'assistant') {
      const tid = 'hist' + Math.random().toString(36).slice(2, 9);
      addEl(`<div class="msg ai" id="${tid}"><div class="av ai" aria-label="AI"><span aria-hidden="true">◆</span></div><div class="mb"><div class="bub"><div class="prose"></div></div><div class="mmeta"><span class="mt"></span></div></div></div>`);
      const prose = document.getElementById(tid).querySelector('.prose');
      prose.innerHTML = marked.parse(m.content || '');
      prose.querySelectorAll('pre code').forEach(b => { hljs.highlightElement(b); addCodeHeader(b); });
    }
  });
  // Server history is per-connection; loaded chats are view-only until new messages
  ws({ action: 'clear' });
  renderConvs();
  if (S.ascroll) scr();
  focusI();
}

function deleteConv(id) {
  S.convs = S.convs.filter(c => c.id !== id);
  localStorage.setItem('cui3', JSON.stringify(S.convs));
  localStorage.removeItem('cui_msgs_' + id);
  if (S.aid === id) newChat();
  renderConvs();
}

function newChat() {
  if (S.streaming) stopGen();
  S.aid = null; S.msgHistory = [];
  mlist().innerHTML = '';
  document.getElementById('welcome').style.display = 'flex';
  ws({ action: 'clear' }); renderConvs(); focusI();
}

/* ═══════════════════════════════════════════════════════════
   THEMES & SETTINGS
   ═══════════════════════════════════════════════════════════ */
function applyTheme(name) {
  const theme = THEME_DATA[name];
  if (!theme) return;
  const root = document.documentElement;
  Object.entries(theme).forEach(([k, v]) => {
    if (k !== 'mode') root.style.setProperty(k, v);
  });
  document.body.classList.toggle('mode-light', theme.mode === 'light');
  document.body.classList.toggle('mode-dark', theme.mode === 'dark');
  const sel = document.getElementById('themeSelect');
  if (sel) sel.value = name;
  localStorage.setItem('cui_theme', name);
}

function initThemeDots() {
  const sel = document.getElementById('themeSelect');
  if (!sel) return;
  sel.innerHTML = '';
  Object.keys(THEME_DATA).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = THEME_LABELS[name] || name;
    if (name === ACTIVE_THEME) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => applyTheme(sel.value));
  const saved = localStorage.getItem('cui_theme');
  if (saved && THEME_DATA[saved]) applyTheme(saved);
  else applyTheme(ACTIVE_THEME);
}

function setFont(type) {
  const FONTS = {
    sans:  { sans: "'Sora', system-ui, sans-serif",           mono: "'JetBrains Mono', monospace" },
    serif: { sans: "'Cormorant Garamond', Georgia, serif",     mono: "'JetBrains Mono', monospace" },
    mono:  { sans: "'JetBrains Mono', monospace",              mono: "'JetBrains Mono', monospace" },
  };
  const picked = FONTS[type] || FONTS.sans;
  document.documentElement.style.setProperty('--font-sans', picked.sans);
  document.documentElement.style.setProperty('--font-mono', picked.mono);
  document.querySelectorAll('.font-opt').forEach(b => {
    const active = b.dataset.font === type;
    b.classList.toggle('active', active);
    b.setAttribute('aria-pressed', String(active));
  });
  localStorage.setItem('cui_font', type);
}

function setSize(size) {
  const SIZES = { sm: '14px', md: '15.5px', lg: '17px' };
  document.documentElement.style.setProperty('--font-size-base', SIZES[size] || '15.5px');
  document.querySelectorAll('.size-opt').forEach(b => {
    const active = b.dataset.size === size;
    b.classList.toggle('active', active);
    b.setAttribute('aria-pressed', String(active));
  });
  localStorage.setItem('cui_size', size);
}

/* ═══════════════════════════════════════════════════════════
   INIT WELCOME
   ═══════════════════════════════════════════════════════════ */
function initWelcome() {
  const sub = document.getElementById('welcomeSub');
  if (sub) {
    const txt = '{{SUBTITLE}}';
    if (txt) sub.textContent = txt;
    else sub.style.display = 'none';
  }
  const chipsData = {{CHIPS_JSON}};
  const row = document.getElementById('chipsRow');
  if (row && chipsData && chipsData.length) {
    row.innerHTML = chipsData.map(c =>
      `<button class="chip" onclick="chip(${JSON.stringify(c)})">${esc(c)}</button>`
    ).join('');
  } else if (row) {
    row.style.display = 'none';
  }
}

/* ═══════════════════════════════════════════════════════════
   SYSTEM PROMPT
   ═══════════════════════════════════════════════════════════ */
function toggleSys() {
  const panel = document.getElementById('sysPanel');
  const btn = document.getElementById('sysBtn');
  const open = !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  panel.setAttribute('aria-hidden', String(!open));
  if (btn) {
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', open ? 'Close settings' : 'Open settings');
  }
  if (open) {
    const sel = document.getElementById('themeSelect');
    if (sel) sel.focus();
  }
}
function saveSystem() {
  const p = document.getElementById('sysTa').value.trim();
  if (!p) {
    showToast('Enter a system prompt before applying', 'warning');
    return;
  }
  ws({ action: 'update_system', prompt: p });
  const panel = document.getElementById('sysPanel');
  const btn = document.getElementById('sysBtn');
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  if (btn) {
    btn.setAttribute('aria-expanded', 'false');
    btn.setAttribute('aria-label', 'Open settings');
  }
  showToast('System prompt applied — starting a fresh chat', 'success');
  newChat();
}

/* ═══════════════════════════════════════════════════════════
   EXPORT / IMPORT
   ═══════════════════════════════════════════════════════════ */
function exportConv() {
  if (!S.msgHistory.length) return;
  const md = `# ChatUI Export\n${new Date().toLocaleString()}\n\n---\n\n` +
    S.msgHistory.map(m => `## ${m.role === 'user' ? 'You' : 'AI'}\n\n${m.content}`).join('\n\n---\n\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
  a.download = `chatui-${Date.now()}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importConv() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.md,.txt';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      showToast('Import file too large (max 2 MB)', 'error');
      return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      const text = String(ev.target.result || '');
      const msgs = parseExportedMarkdown(text);
      if (!msgs.length) {
        showToast('Could not parse conversation from file', 'warning');
        return;
      }
      newChat();
      S.msgHistory = msgs;
      document.getElementById('welcome').style.display = 'none';
      mlist().innerHTML = '';
      msgs.forEach(m => {
        if (m.role === 'user') appendUser(m.content);
        else {
          const tid = 'imp' + Math.random().toString(36).slice(2, 9);
          addEl(`<div class="msg ai" id="${tid}"><div class="av ai" aria-label="AI"><span aria-hidden="true">◆</span></div><div class="mb"><div class="bub"><div class="prose"></div></div></div></div>`);
          const prose = document.getElementById(tid).querySelector('.prose');
          prose.innerHTML = marked.parse(m.content || '');
        }
      });
      saveConv();
      showToast('Imported ' + msgs.length + ' messages', 'success');
    };
    reader.readAsText(file);
  };
  input.click();
}

function parseExportedMarkdown(text) {
  const parts = text.split(/\n---\n/).map(s => s.trim()).filter(Boolean);
  const msgs = [];
  for (const part of parts) {
    const m = part.match(/^##\s+(You|AI)\s*\n+([\s\S]*)$/i);
    if (!m) continue;
    msgs.push({
      role: m[1].toLowerCase() === 'you' ? 'user' : 'assistant',
      content: m[2].trim(),
    });
  }
  return msgs;
}

/* ═══════════════════════════════════════════════════════════
   MOBILE SIDEBAR
   ═══════════════════════════════════════════════════════════ */
function toggleSidebar(force) {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sbBackdrop');
  const menuBtn = document.getElementById('menuBtn');
  const open = typeof force === 'boolean' ? force : !sidebar.classList.contains('open');
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
  if (open) backdrop.removeAttribute('hidden');
  else backdrop.setAttribute('hidden', '');
  if (menuBtn) {
    menuBtn.setAttribute('aria-expanded', String(open));
    menuBtn.setAttribute('aria-label', open ? 'Close sidebar menu' : 'Open sidebar menu');
  }
  document.body.classList.toggle('sidebar-open', open);
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  connect();
  renderConvs();
  initThemeDots();
  initWelcome();
  const foot = document.getElementById('sbFootText');
  if (foot) foot.textContent = 'ChatUI';

  document.querySelectorAll('.font-opt').forEach(btn =>
    btn.addEventListener('click', () => setFont(btn.dataset.font))
  );
  document.querySelectorAll('.size-opt').forEach(btn =>
    btn.addEventListener('click', () => setSize(btn.dataset.size))
  );

  const savedFont = localStorage.getItem('cui_font');
  const savedSize = localStorage.getItem('cui_size');
  if (savedFont) setFont(savedFont);
  if (savedSize) setSize(savedSize);

  const inp = document.getElementById('ci');
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
    if (e.key === 'Escape' && S.streaming) { e.preventDefault(); stopGen(); }
  });
  inp.addEventListener('input', e => {
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 160) + 'px';
  });

  document.getElementById('sb2').addEventListener('click', sendMsg);
  document.getElementById('stb').addEventListener('click', stopGen);
  document.getElementById('newBtn').addEventListener('click', newChat);
  document.getElementById('sysBtn').addEventListener('click', toggleSys);
  document.getElementById('sysSave').addEventListener('click', saveSystem);
  document.getElementById('expBtn').addEventListener('click', exportConv);
  document.getElementById('impBtn').addEventListener('click', importConv);
  document.getElementById('menuBtn').addEventListener('click', toggleSidebar);
  document.getElementById('sbBackdrop').addEventListener('click', toggleSidebar);
  document.getElementById('mwrap').addEventListener('scroll', () => {
    const c = document.getElementById('mwrap');
    S.ascroll = (c.scrollHeight - c.scrollTop - c.clientHeight < 80);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const sidebar = document.getElementById('sidebar');
      if (sidebar && sidebar.classList.contains('open')) {
        e.preventDefault();
        toggleSidebar(false);
        return;
      }
      const panel = document.getElementById('sysPanel');
      if (panel && panel.classList.contains('open')) {
        e.preventDefault();
        toggleSys();
        return;
      }
    }
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'k') { e.preventDefault(); toggleSidebar(); }
      if (e.key === 'n' && !S.streaming) { e.preventDefault(); newChat(); }
    }
  });

  focusI();
});
</script>
