[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatui"
version = "0.3.0"
description = "Open-source UI library for AI chatbots. Gradio/Streamlit-style Python API with 2 layouts and 4 themes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "ChatUI Contributors" },
]
keywords = ["chatbot", "ai", "chat", "ui", "fastapi", "websocket", "streamlit", "gradio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/chatui/chatui"
Repository = "https://github.com/chatui/chatui"
Issues = "https://github.com/chatui/chatui/issues"

[project.scripts]
chatui = "chatui:main"

[tool.hatch.build.targets.wheel]
packages = ["chatui"]

[tool.hatch.build.targets.wheel.force-include]
"chatui/ui/index.html" = "chatui/ui/index.html"
"chatui/ui/css" = "chatui/ui/css"
"chatui/ui/vendor" = "chatui/ui/vendor"
"chatui/ui/js" = "chatui/ui/js"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
