[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatui"
version = "0.2.0"
description = "The Python chatbot framework that doesn't suck"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["chatbot", "ai", "llm", "ui", "fastapi", "anthropic", "claude", "websocket", "tools", "function-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "anthropic>=0.34.2",
    "python-dotenv>=1.0.1",
    "websockets>=12.0",
]

[project.optional-dependencies]
# pip install chatui[ollama]  — local free inference
ollama = ["openai>=1.0.0"]
# pip install chatui[groq]    — free cloud inference
groq   = ["openai>=1.0.0"]
# pip install chatui[openai]  — GPT-4o
openai = ["openai>=1.0.0"]
# pip install chatui[all]     — everything
all    = ["openai>=1.0.0"]

[project.scripts]
chatui = "chatui:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/chatui"
Repository = "https://github.com/YOUR_USERNAME/chatui"
Issues = "https://github.com/YOUR_USERNAME/chatui/issues"
Changelog = "https://github.com/YOUR_USERNAME/chatui"

[tool.hatch.build.targets.wheel]
packages = ["chatui"]
include = ["chatui/ui/*.html"]
