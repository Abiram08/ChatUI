[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatui"
version = "0.0.1"
description = "The fastest way to ship a production AI chatbot. One import, three lines. The Streamlit competitor for chatbots."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["chatbot", "ai", "llm", "ui", "fastapi", "anthropic", "claude", "websocket", "tools", "function-calling", "streamlit", "chatgpt", "gpt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "anthropic>=0.34.2",
    "python-dotenv>=1.0.1",
    "websockets>=12.0",
]

[project.optional-dependencies]
ollama = ["openai>=1.0.0"]
groq   = ["openai>=1.0.0"]
openai = ["openai>=1.0.0"]
all    = ["openai>=1.0.0"]

[project.scripts]
chatui = "chatui:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/chatui"
Repository = "https://github.com/YOUR_USERNAME/chatui"
Issues = "https://github.com/YOUR_USERNAME/chatui/issues"
Changelog = "https://github.com/YOUR_USERNAME/chatui"

[tool.hatch.build.targets.wheel]
packages = ["chatui"]
include = ["chatui/ui/*.html"]
