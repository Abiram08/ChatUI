[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatui"
version = "0.2.0"
description = "Open-source Python UI library for production AI chatbots. Streamlit-style DX, premium chat UI, zero frontend build."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "ChatUI Contributors" },
]
keywords = [
    "chatbot", "ai", "llm", "ui", "open-source", "fastapi",
    "anthropic", "claude", "websocket", "tools", "function-calling",
    "streamlit", "chatgpt", "gpt", "groq", "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "python-dotenv>=1.0.1",
    "websockets>=12.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34.2"]
ollama = ["openai>=1.0.0"]
groq = ["openai>=1.0.0"]
openai = ["openai>=1.0.0"]
all = ["openai>=1.0.0", "anthropic>=0.34.2"]
sanitize = ["nh3>=0.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "openai>=1.0.0",
    "anthropic>=0.34.2",
]

[project.scripts]
chatui = "chatui:main"

[project.urls]
Homepage = "https://github.com/chatui/chatui"
Repository = "https://github.com/chatui/chatui"
Issues = "https://github.com/chatui/chatui/issues"
Changelog = "https://github.com/chatui/chatui/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["chatui"]

[tool.hatch.build.targets.wheel.force-include]
"chatui/ui/index.html" = "chatui/ui/index.html"
"chatui/ui/css" = "chatui/ui/css"
"chatui/ui/vendor" = "chatui/ui/vendor"
"chatui/ui/js" = "chatui/ui/js"

[tool.hatch.build.targets.sdist]
include = [
    "chatui",
    "tests",
    "demo",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "AGENTS.md",
    "ARCHITECTURE.md",
    "pyproject.toml",
    "requirements.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["chatui"]
branch = true
omit = ["chatui/ui/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
